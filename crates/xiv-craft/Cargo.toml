[package]
name = "xiv-craft"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "FFXIV crafting engine mirroring FFXIV.Domain/CraftingEngine, proven by C# parity goldens"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
