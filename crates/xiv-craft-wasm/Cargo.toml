[package]
name = "xiv-craft-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen bindings over xiv-craft with the FFXIV.Api DTO shapes; built into frontend/src/wasm"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
xiv-craft = { path = "../xiv-craft" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]
