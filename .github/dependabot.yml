# Weekly dependency updates, grouped so one PR per ecosystem carries the minor and patch bumps.
# Security updates are opened as soon as an advisory lands, outside the groups.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The runtime is Node 22 in CI and 24 on Vercel; the types must not run ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the native compiler) is rejected by typescript-eslint as shipped in
      # eslint-config-next (see #37); 6.x still fits that tooling's peer range.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /crates/xiv-craft
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /crates/xiv-craft-wasm
    schedule:
      interval: weekly
      day: monday
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
