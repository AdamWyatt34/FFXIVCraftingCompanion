name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region'
        required: true
        default: 'eastus'
        type: string
      environment:
        description: 'Environment name'
        required: true
        default: 'prod'
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Azure Login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --location ${{ inputs.location }}

      - name: Clean up failed Container App (if stuck)
        run: |
          if az containerapp show \
            --name ffxiv-${{ inputs.environment }}-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.provisioningState" -o tsv 2>/dev/null | grep -qi "failed"; then
            echo "Deleting failed Container App..."
            az containerapp delete \
              --name ffxiv-${{ inputs.environment }}-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --yes
          else
            echo "No failed Container App to clean up."
          fi

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters location=${{ inputs.location }} environment=${{ inputs.environment }}
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          CONTAINER_IMAGE: ghcr.io/adamwyatt34/ffxiv-crafting-api:latest
          DEPLOY_SQL: 'false'
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}

      - name: Show Outputs
        run: |
          az deployment group show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query "properties.outputs" \
            --output table
