name: Infrastructure Deploy

on:
  workflow_dispatch:
    inputs:
      location:
        description: 'Azure region'
        required: true
        default: 'eastus'
        type: string
      environment:
        description: 'Environment name'
        required: true
        default: 'prod'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        run: |
          az group create \
            --name ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --location ${{ inputs.location }}

      - name: Clean up failed Container App (if stuck)
        run: |
          if az containerapp show \
            --name ffxiv-${{ inputs.environment }}-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "properties.provisioningState" -o tsv 2>/dev/null | grep -qi "failed"; then
            echo "Deleting failed Container App..."
            az containerapp delete \
              --name ffxiv-${{ inputs.environment }}-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --yes
          else
            echo "No failed Container App to clean up."
          fi

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --parameters location=${{ inputs.location }} environment=${{ inputs.environment }}
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/ffxiv-crafting-api:latest
          DEPLOY_SQL: 'false'
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_REDIRECT_URI: ${{ secrets.DISCORD_REDIRECT_URI }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_PASSWORD }}

      - name: Show Outputs
        run: |
          az deployment group show \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name main \
            --query "properties.outputs" \
            --output table
