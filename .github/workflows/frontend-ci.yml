name: Frontend CI

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Informational: Dependabot opens the fixing PRs; this makes a high or critical advisory visible in the log.
      - name: Known vulnerabilities in npm packages
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Check the committed wasm artifact
        run: npm run wasm:check

      - name: Unit tests
        run: npm test

      - name: Build
        # data-fetch.mjs downloads the data set pinned in data.lock.json; the repository is
        # private, so the download is authenticated with the workflow token.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end (offline simulator and solver)
        # Rebuilds against the mock API the tests own; see e2e/mock-api.mjs.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
