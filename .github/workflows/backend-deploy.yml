name: Backend Deploy

on:
  push:
    branches: [main]
    paths: ['src/**', 'Dockerfile']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adamwyatt34/ffxiv-crafting-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test FFXIVCraftingCompanion.slnx --configuration Release --verbosity normal

  push-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: sha-${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        run: |
          # Check if the Container App exists before updating
          if az containerapp show \
            --name ffxiv-prod-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null; then
            echo "Container App exists, updating image..."
            az containerapp update \
              --name ffxiv-prod-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.push-image.outputs.image-tag }}
          else
            echo "::warning::Container App does not exist yet. Run the Infrastructure Deploy workflow first."
          fi
