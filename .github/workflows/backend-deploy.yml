name: Backend Deploy

on:
  push:
    branches: [main]
    paths: ['src/**', 'Dockerfile']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adamwyatt34/ffxiv-crafting-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test FFXIVCraftingCompanion.slnx --configuration Release --verbosity normal

  push-image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: sha-${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  migrate:
    needs: push-image
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: ${{ secrets.SQL_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The SQL server only admits Azure services; the runner needs a rule of its own for the
      # duration of the job. The server's resource group is looked up rather than assumed.
      - name: Open the SQL firewall for this runner
        id: firewall
        run: |
          server=$(sed -n 's/.*Server=tcp:\([^.,;]*\).*/\1/p' <<< "$ConnectionStrings__DefaultConnection")
          rg=$(az sql server list --query "[?name=='$server'].resourceGroup" -o tsv)
          ip=$(curl -fsS https://api.ipify.org)
          rule="gha-migrate-${GITHUB_RUN_ID}"
          az sql server firewall-rule create \
            --name "$rule" --server "$server" --resource-group "$rg" \
            --start-ip-address "$ip" --end-ip-address "$ip" -o none
          {
            echo "server=$server"
            echo "rg=$rg"
            echo "rule=$rule"
          } >> "$GITHUB_OUTPUT"

      - name: Apply EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet restore src/FFXIV.Infrastructure
          dotnet ef database update --project src/FFXIV.Infrastructure

      - name: Close the SQL firewall
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az sql server firewall-rule delete \
            --name "${{ steps.firewall.outputs.rule }}" \
            --server "${{ steps.firewall.outputs.server }}" \
            --resource-group "${{ steps.firewall.outputs.rg }}"

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Container Apps
        run: |
          # Check if the Container App exists before updating
          if az containerapp show \
            --name ffxiv-prod-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "name" -o tsv 2>/dev/null; then
            echo "Container App exists, updating image..."
            az containerapp update \
              --name ffxiv-prod-api \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.push-image.outputs.image-tag }}
          else
            echo "::warning::Container App does not exist yet. Run the Infrastructure Deploy workflow first."
          fi
