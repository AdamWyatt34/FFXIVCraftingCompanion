name: Backend CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FFXIVCraftingCompanion.slnx

      - name: Build
        run: dotnet build FFXIVCraftingCompanion.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FFXIVCraftingCompanion.slnx --no-build --configuration Release --verbosity normal
