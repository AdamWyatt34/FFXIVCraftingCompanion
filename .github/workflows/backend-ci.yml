name: Backend CI

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx', 'Directory.Build.props', '.editorconfig', 'global.json', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'tests/**', '*.slnx', 'Directory.Build.props', '.editorconfig', 'global.json', '.github/workflows/backend-ci.yml']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FFXIVCraftingCompanion.slnx

      - name: Build
        run: dotnet build FFXIVCraftingCompanion.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FFXIVCraftingCompanion.slnx --no-build --configuration Release --verbosity normal

      # Informational: Dependabot opens the fixing PRs; this makes a transitive advisory visible in the log.
      - name: Known vulnerabilities in NuGet packages
        continue-on-error: true
        run: |
          dotnet list FFXIVCraftingCompanion.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q 'has the following vulnerable packages' vulnerable.txt
