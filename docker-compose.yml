services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ffxiv-crafting-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong!Passw0rd" -C -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ffxiv-crafting-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqldata:
  redisdata:
